name: '🍎 Build Custom macOS (Telegram + Multi-Team Hub)'

on:
  push:
    branches:
      - 'build/macos*'
  workflow_dispatch:
    inputs:
      aioncore_branch:
        description: 'Branch on nhantochi95/AionCore to bundle'
        required: false
        default: 'feat/telegram-team-hub'
        type: string

permissions:
  contents: read

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'
  AIONUI_HUB_TAG: 'dist-ebc6a2b'
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: '600'
  CARGO_NET_RETRY: '10'

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            rust_target: aarch64-apple-darwin
            artifact_name: AionUi-macos-arm64
          - arch: x64
            rust_target: x86_64-apple-darwin
            artifact_name: AionUi-macos-x64

    steps:
      - name: Checkout AionUi
        uses: actions/checkout@v4

      - name: Ensure Rosetta 2 for x64 cross-target tools
        if: matrix.arch == 'x64'
        shell: bash
        run: |
          if ! /usr/bin/pgrep oahd >/dev/null 2>&1; then
            sudo softwareupdate --install-rosetta --agree-to-license || true
          fi

      - name: Clone custom AionCore (${{ inputs.aioncore_branch || 'feat/telegram-team-hub' }})
        shell: bash
        run: |
          AIONCORE_REF="${{ inputs.aioncore_branch || 'feat/telegram-team-hub' }}"
          rm -rf "${RUNNER_TEMP}/aioncore-src"
          git clone --depth 1 --branch "${AIONCORE_REF}" "https://github.com/${GITHUB_REPOSITORY_OWNER}/AionCore.git" "${RUNNER_TEMP}/aioncore-src"
          git -C "${RUNNER_TEMP}/aioncore-src" log -1 --oneline

      - name: Setup Rust toolchain for ${{ matrix.rust_target }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache AionCore Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '${{ runner.temp }}/aioncore-src -> target'
          shared-key: custom-aioncore-${{ matrix.rust_target }}

      - name: Compile custom AionCore (${{ matrix.rust_target }})
        shell: bash
        run: |
          cd "${RUNNER_TEMP}/aioncore-src"
          cargo build --release --target "${{ matrix.rust_target }}" -p aionui-app
          ls -lh "target/${{ matrix.rust_target }}/release/aioncore"
          echo "AIONUI_LOCAL_AIONCORE_BIN=${RUNNER_TEMP}/aioncore-src/target/${{ matrix.rust_target }}/release/aioncore" >> "$GITHUB_ENV"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/.cache/electron
            ${{ runner.temp }}/.cache/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-cache-macos-${{ matrix.arch }}-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            electron-cache-macos-${{ matrix.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run postinstall
        run: bun run postinstall || true

      - name: Rebuild native modules for Electron
        run: bunx electron-builder install-app-deps
        env:
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder

      - name: Prepare custom bundled AionCore
        shell: bash
        run: node scripts/prepareAioncore.js
        env:
          AIONUI_BACKEND_ARCH: ${{ matrix.arch }}

      - name: Clean up stale disk images
        shell: bash
        run: |
          hdiutil info 2>/dev/null | grep '/dev/disk' | awk '{print $1}' | while read disk; do
            hdiutil detach "$disk" -force 2>/dev/null || true
          done
          rm -f /tmp/*.dmg 2>/dev/null || true

      - name: Build macOS DMG & ZIP (${{ matrix.arch }})
        shell: bash
        run: node scripts/build-with-builder.js ${{ matrix.arch }} --mac --${{ matrix.arch }}
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers
          npm_config_cache: ${{ runner.temp }}/.npm
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CI: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List macOS artifacts
        shell: bash
        run: ls -lh out/

      - name: Upload macOS DMG & ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            out/*.dmg
            out/AionUi-*-mac-*.zip
          if-no-files-found: error
          retention-days: 14
